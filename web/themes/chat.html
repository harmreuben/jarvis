<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JARVIS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
    :root {
        --bg: #0f1115; --surface: #171a21; --border: #262b35; --text: #e7eaf0; --muted: #8d96a7;
        --user: #2f6df6; --user-text: #ffffff; --bot: #1f232c; --accent: #2f6df6; --live: #22c55e;
    }
    :root[data-theme="light"] {
        --bg: #f6f7f9; --surface: #ffffff; --border: #e3e6eb; --text: #1b1f27; --muted: #6b7280;
        --user: #2f6df6; --user-text: #ffffff; --bot: #eceff3; --accent: #2f6df6;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--text); font: 15px/1.5 Inter, "Segoe UI", sans-serif; }
    .app { display: flex; flex-direction: column; height: 100vh; max-width: 900px; margin: 0 auto; }
    header {
        display: flex; align-items: center; gap: 12px; padding: 14px 20px; border-bottom: 1px solid var(--border);
    }
    .avatar {
        width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; font-weight: 600; color: #fff;
        background: radial-gradient(circle at 35% 35%, #7cc4ff, #2f6df6 70%);
    }
    .who { flex: 1; }
    .who .n { font-weight: 600; }
    .who .s { color: var(--muted); font-size: 13px; display: flex; align-items: center; gap: 6px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
    .dot.live { background: var(--live); box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.6); animation: ping 1.6s infinite; }
    .dot.busy { background: #f59e0b; }
    @keyframes ping { 70% { box-shadow: 0 0 0 7px rgba(34, 197, 94, 0); } 100% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); } }
    .hbtn {
        border: 1px solid var(--border); background: var(--surface); color: var(--text); border-radius: 10px;
        height: 36px; min-width: 36px; padding: 0 10px; cursor: pointer; font-size: 15px;
    }
    .hbtn:hover { border-color: var(--accent); }
    main { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
    .empty { margin: auto; text-align: center; color: var(--muted); max-width: 420px; }
    .empty h1 { color: var(--text); font-size: 22px; margin: 0 0 6px; }
    .bubble { max-width: 78%; padding: 10px 14px; border-radius: 16px; word-wrap: break-word; }
    .bubble.user { align-self: flex-end; background: var(--user); color: var(--user-text); border-bottom-right-radius: 4px; }
    .bubble.assistant { align-self: flex-start; background: var(--bot); border-bottom-left-radius: 4px; }
    .typing { align-self: flex-start; background: var(--bot); padding: 12px 16px; border-radius: 16px; display: none; gap: 4px; }
    .typing span { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); animation: blink 1.2s infinite; }
    .typing span:nth-child(2) { animation-delay: 0.2s; } .typing span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes blink { 0%, 80%, 100% { opacity: 0.25; } 40% { opacity: 1; } }
    footer { padding: 14px 20px 18px; }
    .composer {
        display: flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--border);
        border-radius: 14px; padding: 6px 6px 6px 16px;
    }
    .composer:focus-within { border-color: var(--accent); }
    .composer input { flex: 1; border: 0; background: transparent; color: var(--text); font: inherit; outline: none; padding: 8px 0; }
    .cbtn { width: 40px; height: 40px; border-radius: 10px; border: 0; cursor: pointer; font-size: 17px; background: transparent; color: var(--muted); }
    .cbtn.mic.on { background: rgba(34, 197, 94, 0.15); color: var(--live); }
    .cbtn.send { background: var(--accent); color: #fff; }
    .hint { color: var(--muted); font-size: 12px; text-align: center; margin-top: 8px; }
</style>
</head>
<body>
<div class="app">
    <header>
        <div class="avatar">J</div>
        <div class="who"><div class="n" id="aname">JARVIS</div><div class="s"><span class="dot" id="dot"></span><span id="status">Connecting…</span></div></div>
        <button class="hbtn" id="mode" title="Light / dark">☀</button>
        <button class="hbtn" id="gear" title="Settings">⚙</button>
    </header>
    <main id="messages">
        <div class="empty" id="empty">
            <h1>How can I help?</h1>
            Say <b>"Jarvis"</b> followed by your request, or type below.<br>
            Try: "Jarvis, summarise today's tech news" or "open notepad".
        </div>
        <div class="typing" id="typing"><span></span><span></span><span></span></div>
    </main>
    <footer>
        <form class="composer" id="form" autocomplete="off">
            <input id="input" type="text" placeholder="Message JARVIS…">
            <button class="cbtn mic" id="mic" type="button" title="Listening on/off (Ctrl+Space)">🎤</button>
            <button class="cbtn send" type="submit" title="Send">➤</button>
        </form>
        <div class="hint">Ctrl+Space turns voice on/off · voice commands start with the wake word</div>
    </footer>
</div>
<script src="/eel.js"></script>
<script src="/assets/jarvis-core.js"></script>
<script>
    var root = document.documentElement;
    try { if (localStorage.getItem('jarvis-chat-theme') === 'light') root.setAttribute('data-theme', 'light'); } catch (e) {}
    document.getElementById('mode').addEventListener('click', function () {
        var light = root.getAttribute('data-theme') !== 'light';
        if (light) root.setAttribute('data-theme', 'light'); else root.removeAttribute('data-theme');
        try { localStorage.setItem('jarvis-chat-theme', light ? 'light' : 'dark'); } catch (e) {}
    });

    var box = document.getElementById('messages'), typing = document.getElementById('typing');
    JarvisCore.on('messages', function (list) {
        document.getElementById('empty').style.display = 'none';
        list.forEach(function (m) {
            var b = document.createElement('div');
            b.className = 'bubble ' + m.role;
            b.innerHTML = m.text; // escaped by Python
            box.insertBefore(b, typing);
        });
        box.scrollTop = box.scrollHeight;
    });
    JarvisCore.on('state', function (s) {
        document.getElementById('status').textContent = s;
        var busy = /thinking|searching|writing|looking|reading|waiting/i.test(s);
        typing.style.display = busy ? 'flex' : 'none';
        var dot = document.getElementById('dot');
        dot.className = 'dot' + (busy || /speaking|yes\?/i.test(s) ? ' busy' : /listening/i.test(s) ? ' live' : '');
        if (busy) box.scrollTop = box.scrollHeight;
    });
    JarvisCore.on('listening', function (on) { document.getElementById('mic').classList.toggle('on', on); });
    JarvisCore.init({
        form: document.getElementById('form'), input: document.getElementById('input'),
        micButton: document.getElementById('mic'), settingsButton: document.getElementById('gear')
    });
    eel.js_assistantname()(function (n) {
        document.getElementById('aname').textContent = n;
        document.querySelector('.avatar').textContent = (n || 'J').charAt(0).toUpperCase();
    });
    document.getElementById('input').focus();
</script>
</body>
</html>
